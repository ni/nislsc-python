name: Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
   contents: read

jobs:
  build:
    name: Build
    runs-on:
      - ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: ni/python-actions/setup-python@dee640bba235ae28fdc6b7337c643bd06358ae90 # v0.9.0
        id: setup-python
      - name: Set up Poetry
        uses: ni/python-actions/setup-poetry@dee640bba235ae28fdc6b7337c643bd06358ae90 # v0.9.0
      - name: Cache virtualenv (all extras)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: nislsc-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          poetry install
      - name: Run linters
        run: poetry run ni-python-styleguide lint
      - name: Run mypy (Linux)
        run: poetry run mypy
      - name: Run mypy (Windows)
        run: poetry run mypy --platform win32
      - name: Run Bandit security checks
        run: poetry run bandit -c pyproject.toml -r generated/nislsc
      - name: Generate ni-slsc files
        run: |
          rm -fr generated/nislsc
          poetry run python src/codegen/generator.py
      - name: Check for files dirtied by codegen
        run: git diff --exit-code
