name: Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
   contents: read

jobs:
  build:
    name: Build
    runs-on:
      - ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: ni/python-actions/setup-python@a2554c7e5680982d3355677b2290e48b60678744 # v0.8.0
        id: setup-python
      - name: Set up Poetry
        uses: ni/python-actions/setup-poetry@a2554c7e5680982d3355677b2290e48b60678744 # v0.8.0
      - name: Cache virtualenv (all extras)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .venv
          key: nislsc-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          poetry install
      - name: Run linters
        run: poetry run ni-python-styleguide lint
      - name: Run mypy (Linux)
        run: poetry run mypy
      - name: Run mypy (Windows)
        run: poetry run mypy --platform win32
      - name: Run Bandit security checks
        run: poetry run bandit -c pyproject.toml -r generated/nislsc
      - name: Generate ni-slsc files
        run: |
          rm -fr generated/nislsc
          poetry run python src/codegen/generator.py
      - name: Check for files dirtied by codegen
        run: git diff --exit-code
